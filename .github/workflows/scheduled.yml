name: Daily Script

on:
  schedule:
    # Triggers precisely at 06:00 UTC daily (7:00 AM West Africa Time)
    - cron: '0 6 * * *'

  workflow_dispatch: # Allows frictionless manual overrides from the UI button

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
       
        env:
          API_KEY: ${{ secrets.API_KEY }}
          OWN_EMAIL: ${{ secrets.OWN_EMAIL }}
          OWN_PASSWORD: ${{ secrets.OWN_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py

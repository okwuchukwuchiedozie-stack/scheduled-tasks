name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured

        env:
          API_KEY: ${{ secrets.API_KEY }}
          OWN_EMAIL: ${{ secrets.OWN_EMAIL }}
          OWN_PASSWORD: ${{ secrets.OWN_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          if [ -z "$OWN_EMAIL" ]; then
            echo "❌ OWN_EMAIL secret is not set!"
            echo "Go to Settings > Secrets and variables > Actions and add it."
            exit 1
          else
            echo "✅ OWN_EMAIL configuration verified."
          fi

          if [ -z "$OWN_PASSWORD" ]; then
            echo "❌ OWN_PASSWORD secret is not set!"
            echo "Go to Settings > Secrets and variables > Actions and add it."
            exit 1
          else
            echo "✅ OWN_PASSWORD configuration verified."
          fi

          echo ""
          echo "🎉 All required environment secrets match validation profiles!"

      - name: Check required files exist
        run: |
          echo "Verifying local asset footprint..."

          if [ -f "main.py" ]; then
            echo "✅ main.py verified."
          else
            echo "❌ main.py missing!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt verified."
          else
            echo "❌ requirements.txt missing!"
            exit 1
          fi

          echo ""
          echo "🎉 Structural codebase check complete!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax validation OK"

      - name: Success Summary Notice
        run: |
          echo ""
          echo "========================================"
          echo "🚀 All setup checks passed successfully!"
          echo "   Your automation track is completely ready."
          echo "========================================"

